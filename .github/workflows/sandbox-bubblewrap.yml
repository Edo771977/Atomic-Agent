name: Bubblewrap isolation

on:
  pull_request:
    paths:
      - 'src/sandbox/**'
      - 'src/tools/**'
      - 'src/cli/mcp-server*.ts'
      - '.github/workflows/sandbox-bubblewrap.yml'

permissions:
  contents: read

jobs:
  bubblewrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, root]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.9'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - name: Run real Bubblewrap fixtures with a temporary Node installation
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          fixtures=$(mktemp -d /tmp/atomic-bwrap-ci.XXXXXX)
          tag="atomic-bwrap-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          system_roots=(/etc/ssl/certs /usr/lib /usr/local /srv /mnt /media /opt)
          private_roots=(/var/backups /etc/ssh /etc/ssl/private)
          nix_fixture=""
          cleanup() {
            if [[ -n "$nix_fixture" ]]; then
              sudo rm -f "$nix_fixture/marker" "$nix_fixture/fixture.sock"
              sudo rmdir "$nix_fixture" /nix
            fi
            if mountpoint -q "$fixtures/workspace/inherited"; then sudo umount "$fixtures/workspace/inherited"; fi
            sudo rm -rf "$fixtures" "/run/$tag" "/run/lock/$tag"
            for root in "${system_roots[@]}" "${private_roots[@]}"; do sudo rm -rf "$root/$tag"; done
          }
          trap cleanup EXIT
          mkdir -p "$fixtures/bin" "$fixtures/workspace/inherited" "$fixtures/host-volume"
          printf 'synthetic nested mount fixture\n' > "$fixtures/host-volume/marker"
          sudo mount --bind "$fixtures/host-volume" "$fixtures/workspace/inherited"
          export ATOMIC_AGENT_TEST_NESTED_MOUNT="$fixtures/workspace"
          node_bin=$(dirname "$(command -v node)")
          cp "$node_bin/node" "$fixtures/bin/node"
          export ATOMIC_AGENT_SANDBOX_TOOLCHAINS="$node_bin:$node_bin/../lib/node_modules/npm"
          chmod 0755 "$fixtures" "$fixtures/bin"
          sudo install -d -m 0700 -o "$(id -un)" "/run/$tag" "/run/lock/$tag"
          export PATH="$fixtures/bin:$PATH"
          export ATOMIC_AGENT_REQUIRE_BWRAP=1
          export ATOMIC_AGENT_TEST_RUNTIME_ROOTS="/run/$tag:/var/run/$tag:/run/lock/$tag"
          fixture_roots=()
          for root in "${system_roots[@]}"; do
            sudo install -d -m 0770 -o "$(id -un)" -g "$(id -gn)" "$root/$tag"
            fixture_roots+=("$root/$tag")
          done
          export ATOMIC_AGENT_TEST_SYSTEM_ROOTS=$(IFS=:; echo "${fixture_roots[*]}")
          private_files=()
          for root in "${private_roots[@]}"; do
            sudo install -d -m 0755 "$root/$tag"
            printf 'synthetic private fixture\n' | sudo tee "$root/$tag/marker" >/dev/null
            sudo chmod 0644 "$root/$tag/marker"
            private_files+=("$root/$tag/marker")
          done
          export ATOMIC_AGENT_TEST_PRIVATE_FILES=$(IFS=:; echo "${private_files[*]}")
          if [[ ! -e /nix && ! -L /nix ]]; then
            sudo install -d -m 0755 /nix
            nix_fixture=/nix/store
            sudo install -d -m 1775 -o root -g "$(id -gn)" "$nix_fixture"
            printf 'synthetic store marker\n' | sudo tee "$nix_fixture/marker" >/dev/null
          fi
          export ATOMIC_AGENT_TEST_NIX_STORE="$nix_fixture"
          args=(run --maxWorkers=1 src/sandbox/os-sandbox.test.ts src/sandbox/os-sandbox-runtime.test.ts src/sandbox/sandbox-git-integration.test.ts src/tools/os/shell/shell-sandbox.test.ts src/tools/verify/verify-cwd-sandbox.test.ts)
          runner=("$fixtures/bin/node")
          if [[ "$TEST_MODE" == root ]]; then
            runner=(sudo -H env "PATH=$PATH" ATOMIC_AGENT_REQUIRE_BWRAP=1 ATOMIC_AGENT_SANDBOX_ALLOW_ROOT=1 "ATOMIC_AGENT_TEST_NIX_STORE=$ATOMIC_AGENT_TEST_NIX_STORE" "ATOMIC_AGENT_TEST_RUNTIME_ROOTS=$ATOMIC_AGENT_TEST_RUNTIME_ROOTS" "ATOMIC_AGENT_TEST_SYSTEM_ROOTS=$ATOMIC_AGENT_TEST_SYSTEM_ROOTS" "ATOMIC_AGENT_TEST_PRIVATE_FILES=$ATOMIC_AGENT_TEST_PRIVATE_FILES" "ATOMIC_AGENT_TEST_NESTED_MOUNT=$ATOMIC_AGENT_TEST_NESTED_MOUNT" "ATOMIC_AGENT_SANDBOX_TOOLCHAINS=$ATOMIC_AGENT_SANDBOX_TOOLCHAINS" "$fixtures/bin/node")
          fi
          # Report asynchronous cold inventory and the subsequent live checks.
          "${runner[@]}" --import tsx --input-type=module - <<'JS'
          import { spawnSync } from "node:child_process";
          import { mkdirSync, mkdtempSync, rmSync } from "node:fs";
          import { join } from "node:path";
          import { tmpdir } from "node:os";
          import { buildOsSandboxEnv, buildOsSandboxPolicy, warmLinuxSystemInventory, wrapWithOsSandbox } from "./src/sandbox/os-sandbox.ts";

          const cwd = mkdtempSync(join(tmpdir(), "atomic-cold-"));
          try {
            mkdirSync(join(cwd, ".git"));
            for (let i = 0; i < 80; i++) mkdirSync(join(cwd, String(i)));
            const coldStart = performance.now();
            await warmLinuxSystemInventory();
            console.info("Safe Mode cold system warmup ms: " + (performance.now() - coldStart).toFixed(1));
            for (const label of ["first", "warm"]) {
              const phases = { mounts: 0, git: 0, systemFind: 0, systemFallback: 0, workspaceFind: 0, workspaceFallback: 0 };
              const started = performance.now();
              const policy = buildOsSandboxPolicy({ workspaceRoots: [cwd], network: false });
              const built = performance.now();
              const launch = wrapWithOsSandbox("/bin/ls", [], policy, {
                cwd, onInventoryTiming: (phase, elapsedMs) => { phases[phase] = elapsedMs; },
              });
              const prepared = performance.now();
              if (!launch.ok) throw new Error(launch.reason);
              const child = spawnSync(launch.command, launch.args, { cwd, env: buildOsSandboxEnv(process.env), encoding: "utf8" });
              if (child.status !== 0) throw new Error(child.stderr || String(child.error));
              const timings = { policy: built - started, wrap: prepared - built, spawn: performance.now() - prepared, ...phases };
              console.info(`Safe Mode ${label} phase ms: ${JSON.stringify(timings, (_, value) =>
                typeof value === "number" ? Number(value.toFixed(2)) : value)}`);
            }
          } finally {
            rmSync(cwd, { recursive: true, force: true });
          }
          JS
          "${runner[@]}" node_modules/vitest/vitest.mjs "${args[@]}"
